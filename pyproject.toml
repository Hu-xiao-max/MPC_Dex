[project]
name = "mpc-dex-deployment"
version = "0.1.0"
description = "Local deployment preparation for arXiv:2609.14878v1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium>=1.1,<2",
    "mujoco>=3.3,<4",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "scipy>=1.15,<2",
    "torch>=2.7,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
